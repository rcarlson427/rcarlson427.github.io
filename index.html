<script>

    // Make sure the max value of all 3 attributes combined doesn't exceed 8
    // Also update the heart points and furr-endship values according to the attributes
    // TODO: I will need a check on submit to make sure it does reach 8
    function checkMaxValue(){
        strongNum = parseInt(strongAttribute.value);
        smartNum = parseInt(smartAttribute.value);
        cuteNum = parseInt(cuteAttribute.value);

        if((strongNum+smartNum+cuteNum) == 8){
            document.getElementById('strongAttribute').max = strongNum;
            document.getElementById('smartAttribute').max = smartNum;
            document.getElementById('cuteAttribute').max = cuteNum;
        } else {
            document.getElementById('strongAttribute').max = 5;
            document.getElementById('smartAttribute').max = 5;
            document.getElementById('cuteAttribute').max = 5;
        }

        document.getElementById('heartPoints').value = (strongNum+smartNum);
        document.getElementById('furrendshipPoints').value = cuteNum;
    }

    // Function for checking that the two spells are different
    function spellUpdate(spell){
        if(spell1.value === spell2.value){
            window.alert("Cannot have two of the same spell!");
            event.target.value = "";
        }
    }

    // Update the backpack contents and cattribute based on the childhood
    // TODO: Make this better later
    function childhoodUpdate(){
        if(childhood.value === "Test1"){
            document.getElementById('cattribute').value = "cattribute1";
            document.getElementById('backpack1').value = "backpack1";
            document.getElementById('backpack2').value = "backpack2";

            document.getElementById('backpack3').value = "backback";
            document.getElementById('backpack4').value = "packpack";
            document.getElementById('backpack5').value = "hello";
        }
    }

    function skillCheck(){
        checkedBoxes = parseInt(checkedBoxes);
        if(event.target.checked){
            checkedBoxes = checkedBoxes + 1;
        } else {
            checkedBoxes = checkedBoxes - 1;
        }
        if(checkedBoxes === 2){
            document.querySelectorAll('input.skills:not(:checked)').forEach(checkbox => {
                checkbox.disabled = true;
            });
        } else {
            document.querySelectorAll('input.skills:not(:checked)').forEach(checkbox => {
                checkbox.disabled = false;
            });
        }
    }

    // Event Listeners
    strongAttribute.addEventListener('change',checkMaxValue);

    spell1.addEventListener('change',spellUpdate);

    childhood.addEventListener('change',childhoodUpdate);
    skill1.addEventListener('change',skillCheck);

</script>
